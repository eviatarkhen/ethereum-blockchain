[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "edu-ethereum"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "eth-hash[pycryptodome]",
    "eth-keys",
    "eth-utils",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
